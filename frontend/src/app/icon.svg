<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neo-brutalist Yellow Badge with Solid Black Border -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#FFC900" stroke="#000000" stroke-width="2.5" />
  
  <!-- Graduation Cap Icon in Black -->
  <g transform="translate(4, 4)" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mortarboard Top -->
    <polygon points="12 4 21 8.5 12 13 3 8.5 12 4" fill="#000000" />
    <!-- Cap Lower Band -->
    <path d="M6 11.5v3.5c0 2.5 2.7 4.5 6 4.5s6-2 6-4.5v-3.5" />
    <!-- Tassel -->
    <path d="M21 9v6" />
    <circle cx="21" cy="16" r="1.2" fill="#000000" stroke="none" />
  </g>
</svg>
